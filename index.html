<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APK Scanner 🍻</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 15px;
            background-color: #f5f5f7;
            color: #1d1d1f;
            text-align: center;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .scan-trigger {
            display: block;
            background-color: #ff9f0a;
            color: white;
            padding: 16px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(255, 159, 10, 0.3);
            border: none;
            width: 100%;
        }
        .scan-trigger:active { background-color: #e08b00; }
        .setup-section {
            background: #f2f2f7;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
        }
        .setup-section label {
            display: block;
            font-weight: 600;
            margin-top: 10px;
            font-size: 14px;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            -webkit-appearance: none;
        }
        /* Gömmer det magiska textfältet men håller det aktivt */
        #magic-scanner {
            position: absolute;
            left: -9999px;
            opacity: 0;
        }
        .quick-buttons {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }
        .quick-btn {
            flex: 1;
            background: #e5e5ea;
            border: none;
            padding: 8px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .quick-btn:active { background: #d1d1d6; }
        .result-box {
            padding: 20px;
            background-color: #1c1c1e;
            color: white;
            border-radius: 12px;
            margin-top: 15px;
        }
        .apk-value {
            font-size: 52px;
            font-weight: 900;
            color: #30d158;
            margin: 5px 0;
        }
        .status-text {
            font-size: 15px;
            color: #aeaeae;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Blazingly Fast APK-Scanner 🍻</h2>
    
    <!-- Steg 1: Egenskaper -->
    <div class="setup-section">
        <label>1. Volym (ml):</label>
        <input type="number" id="volume" value="500">
        <div class="quick-buttons">
            <button class="quick-btn" onclick="setVol(330)">33 cl</button>
            <button class="quick-btn" onclick="setVol(440)">44 cl</button>
            <button class="quick-btn" onclick="setVol(500)">50 cl</button>
            <button class="quick-btn" onclick="setVol(750)">75 cl</button>
        </div>

        <label>2. Alkoholhalt (%):</label>
        <input type="number" id="abv" value="5.2" step="0.1">
        <div class="quick-buttons">
            <button class="quick-btn" onclick="setAbv(5.2)">5.2%</button>
            <button class="quick-btn" onclick="setAbv(7.0)">7.0%</button>
            <button class="quick-btn" onclick="setAbv(12.0)">12%</button>
            <button class="quick-btn" onclick="setAbv(40.0)">40%</button>
        </div>
    </div>

    <!-- Det dolda magiska fältet som aktiverar iPhones Live-text-scanner -->
    <input type="text" id="magic-scanner" placeholder="Skanna här" autocomplete="off">

    <!-- Den stora knappen användaren trycker på -->
    <button class="scan-trigger" onclick="startaSkanning()">📷 SKANNA PRISLAPPEN</button>

    <!-- Resultat -->
    <div class="result-box">
        <div class="status-text" id="status">Redo! Ställ in volym & halt och scanna.</div>
        <div class="apk-value" id="apk-result">0.00</div>
        <div style="font-size: 14px; color: #aeaeae;">Alkohol Per Krona (APK)</div>
        <hr style="border: 0; border-top: 1px solid #3a3a3c; margin: 15px 0;">
        <p style="font-size: 14px; color: #aeaeae; margin: 0;">
            Avläst pris: <span id="detected-price" style="color:white; font-weight:bold;">-</span> kr
        </p>
    </div>
</div>

<script>
    const magicScanner = document.getElementById('magic-scanner');
    const statusText = document.getElementById('status');
    const apkResult = document.getElementById('apk-result');
    const detectedPriceText = document.getElementById('detected-price');

    function setVol(ml) { document.getElementById('volume').value = ml; räknaOmMöjligt(); }
    function setAbv(pct) { document.getElementById('abv').value = pct; räknaOmMöjligt(); }

    let globaltPris = null;

    function startaSkanning() {
        // Tömmer fältet och sätter fokus på det dolda fältet
        magicScanner.value = '';
        magicScanner.focus();
        statusText.innerText = "Öppnar iPhones Live Text-kamera...";
    }

    // Lyssnar på när iPhonens inbyggda scanner klistrar in text i fältet
    magicScanner.addEventListener('input', function() {
        const texten = magicScanner.value;
        if (texten.length > 0) {
            statusText.innerText = "Tolkar priset...";
            tolkaTextOchHittaPris(texten);
        }
    });

    function tolkaTextOchHittaPris(text) {
        console.log("Inmatad text från iPhone:", text);
        
        // Letar efter priser (t.ex. 19,90 eller 24:90 eller 25)
        const regex = /\b\d+(?:[\.,:]\d{2})?\b/g;
        const matches = text.match(regex);

        if (matches && matches.length > 0) {
            // Filtrera ut rimliga priser (mellan 5kr och 1000kr) för att missa streckkoder
            const giltigaPriser = matches
                .map(m => m.replace(':', '.').replace(',', '.'))
                .map(m => parseFloat(m))
                .filter(p => !isNaN(p) && p >= 5 && p < 1000);

            if (giltigaPriser.length > 0) {
                let pris = giltigaPriser[0]; // Tar det första rimliga priset den ser
                globaltPris = pris;
                detectedPriceText.innerText = pris.toFixed(2);
                statusText.innerText = "Pris hittat!";
                beräknaAPK(pris);
                return;
            }
        }
        statusText.innerText = "Hittade inget giltigt pris. Skriv in priset manuellt om du vill.";
    }

    function beräknaAPK(pris) {
        const volym = parseFloat(document.getElementById('volume').value);
        const alkohol = parseFloat(document.getElementById('abv').value);

        if (!isNaN(volym) && !isNaN(alkohol) && pris > 0) {
            const renAlkoholMl = volym * (alkohol / 100);
            const apk = renAlkoholMl / pris;
            apkResult.innerText = apk.toFixed(2);
        }
    }

    function räknaOmMöjligt() {
        if (globaltPris) beräknaAPK(globaltPris);
    }
</script>

</body>
</html>
