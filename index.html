<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APK Scanner 🍻</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 15px;
            background-color: #f5f5f7;
            color: #1d1d1f;
            text-align: center;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .label-upload {
            display: block;
            background-color: #ff9f0a;
            color: white;
            padding: 16px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(255, 159, 10, 0.3);
        }
        .setup-section {
            background: #f2f2f7;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
        }
        .setup-section label {
            display: block;
            font-weight: 600;
            margin-top: 10px;
            font-size: 14px;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            -webkit-appearance: none;
        }
        .quick-buttons {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }
        .quick-btn {
            flex: 1;
            background: #e5e5ea;
            border: none;
            padding: 8px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .quick-btn:active { background: #d1d1d6; }
        #preview {
            max-width: 100%;
            max-height: 180px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: none;
            object-fit: contain;
        }
        .result-box {
            padding: 20px;
            background-color: #1c1c1e;
            color: white;
            border-radius: 12px;
            margin-top: 15px;
        }
        .apk-value {
            font-size: 46px;
            font-weight: 900;
            color: #30d158;
            margin: 5px 0;
        }
        .status-text {
            font-size: 15px;
            color: #aeaeae;
            font-weight: 500;
        }
        input[type="file"] { display: none; }
    </style>
    <!-- Vi använder senaste stabila Tesseract.js -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="container">
    <h2>APK-Scanner 🍻</h2>
    
    <div class="setup-section">
        <label>1. Volym (ml):</label>
        <input type="number" id="volume" value="500">
        <div class="quick-buttons">
            <button class="quick-btn" onclick="setVol(330)">33 cl</button>
            <button class="quick-btn" onclick="setVol(440)">44 cl</button>
            <button class="quick-btn" onclick="setVol(500)">50 cl</button>
            <button class="quick-btn" onclick="setVol(750)">75 cl</button>
        </div>

        <label>2. Alkoholhalt (%):</label>
        <input type="number" id="abv" value="5.2" step="0.1">
        <div class="quick-buttons">
            <button class="quick-btn" onclick="setAbv(5.2)">5.2%</button>
            <button class="quick-btn" onclick="setAbv(7.0)">7.0%</button>
            <button class="quick-btn" onclick="setAbv(12.0)">12%</button>
            <button class="quick-btn" onclick="setAbv(40.0)">40%</button>
        </div>
    </div>

    <label class="label-upload">
        📷 Skanna Prislapp
        <input type="file" id="image-input" accept="image/*" capture="environment">
    </label>

    <img id="preview" alt="Prislapp">

    <div class="result-box">
        <div class="status-text" id="status">Väntar på prislapp...</div>
        <div class="apk-value" id="apk-result">0.00</div>
        <div style="font-size: 14px; color: #aeaeae;">Alkohol Per Krona (APK)</div>
        <hr style="border: 0; border-top: 1px solid #3a3a3c; margin: 15px 0;">
        <p style="font-size: 14px; color: #aeaeae; margin: 0;">
            Hittat pris: <span id="detected-price" style="color:white; font-weight:bold;">-</span> kr
        </p>
    </div>
</div>

<script>
    const imageInput = document.getElementById('image-input');
    const preview = document.getElementById('preview');
    const statusText = document.getElementById('status');
    const apkResult = document.getElementById('apk-result');
    const detectedPriceText = document.getElementById('detected-price');

    function setVol(ml) { document.getElementById('volume').value = ml; räknaOmMöjligt(); }
    function setAbv(pct) { document.getElementById('abv').value = pct; räknaOmMöjligt(); }

    let globaltPris = null;

    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        statusText.innerText = "Anpassar iPhone 15-bild...";
        apkResult.innerText = "0.00";
        detectedPriceText.innerText = "-";

        // Skapa en bildläsare för att kunna skala ner bilden
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                // HÄR SKALAS BILDEN NER SÅ ATT IPHONE 15 INTE KRASCHAR MINNET
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800; // Optimal storlek för AI-läsning
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }
                
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                // Visa den nerskalade bilden i appen
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                preview.src = dataUrl;
                preview.style.display = 'block';

                // Skicka den lätta bilden till Tesseract
                startaScanning(dataUrl);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    async function startaScanning(bildKälla) {
        statusText.innerText = "Ansluter till AI-motorn...";
        try {
            // Konfiguration optimerad för iOS Safari
            const worker = await Tesseract.createWorker('swe', 1, {
                workerPath: 'https://jsdelivr.net',
                corePath: 'https://jsdelivr.net',
            });
            
            statusText.innerText = "Läser av text...";
            const { data: { text } } = await worker.recognize(bildKälla);
            await worker.terminate();

            statusText.innerText = "Analyserar siffror...";
            tolkaTextOchHittaPris(text);
        } catch (err) {
            statusText.innerText = "Krasch! Testa att ladda om sidan.";
            console.error(err);
        }
    }

    function tolkaTextOchHittaPris(text) {
        console.log("Skannad råtext:", text);
        
        // Letar efter mönster som "XX,XX" eller "XX:XX" eller bara "XX"
        const regex = /\b\d+(?:[\.,:]\d{2})?\b/g;
        const matches = text.match(regex);

        if (matches && matches.length > 0) {
            // Filtrera ut orimliga priser (t.ex. artikelnummer som är jättelånga)
            const giltigaPriser = matches
                .map(m => m.replace(':', '.').replace(',', '.'))
                .map(m => parseFloat(m))
                .filter(p => !isNaN(p) && p > 2 && p < 1000); // Pris mellan 2kr och 1000kr

            if (giltigaPriser.length > 0) {
                // Vi utgår från att det första giltiga talet i texten är priset
                let pris = giltigaPriser[0];
                globaltPris = pris;
                detectedPriceText.innerText = pris.toFixed(2);
                statusText.innerText = "Pris hittat!";
                beräknaAPK(pris);
                return;
            }
        }
        statusText.innerText = "Kunde ej tolka pris. Kom närmare prislappen.";
    }

    function beräknaAPK(pris) {
        const volym = parseFloat(document.getElementById('volume').value);
        const alkohol = parseFloat(document.getElementById('abv').value);

        if (!isNaN(volym) && !isNaN(alkohol) && pris > 0) {
            const renAlkoholMl = volym * (alkohol / 100);
            const apk = renAlkoholMl / pris;
            apkResult.innerText = apk.toFixed(2);
        }
    }

    function räknaOmMöjligt() {
        if (globaltPris) beräknaAPK(globaltPris);
    }
</script>

</body>
</html>
